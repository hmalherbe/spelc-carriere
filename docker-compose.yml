services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spelc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spelc
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [spelc]

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://spelc:${POSTGRES_PASSWORD}@db:5432/spelc
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Spelc}
      ADEL_URL: ${ADEL_URL:-}
      ADEL_USERNAME: ${ADEL_USERNAME:-}
      ADEL_PASSWORD: ${ADEL_PASSWORD:-}
      ADEL_SPELC_NAME: ${ADEL_SPELC_NAME:-azur}
      ADEL_DEBUG_DIR: /app/adel-debug
      # Domaine public de CETTE instance — nécessaire pour construire un lien de désabonnement
      # fonctionnel dans les mails de notification (voir routes/mailing.ts,
      # buildRecipientUnsubscribeUrl) : sans elle, l'envoi aux non-adhérents est refusé.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
    volumes:
      - ./adel-debug:/app/adel-debug
    depends_on:
      - db
    networks: [spelc]

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    # No host port here anymore — caddy is now the sole public entrypoint (80/443) and reverse
    # proxies to web:80 over the internal network; see Caddyfile.
    depends_on:
      - api
    networks: [spelc]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Ce docker-compose.yml est partagé par la prod (/opt/spelc-carriere) ET l'environnement de
    # test/démo (/opt/spelc-carriere-test), sur le MÊME serveur physique — donc le même port hôte
    # 80/443 ne peut être lié que par l'un des deux. Caddy est le point d'entrée HTTPS commun
    # (spelcca.fr/www.spelcca.fr/demo.spelcca.fr, voir Caddyfile), il ne doit tourner que côté prod ;
    # `profiles` le désactive par défaut (`docker compose up` l'ignore), à activer uniquement côté
    # prod via COMPOSE_PROFILES=caddy dans son .env (jamais dans celui du test/démo) — voir le
    # correctif du 2026-10-18 pour l'incident que son absence a causé (conflit de port avec la prod).
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    # Lets the demo.spelcca.fr site block (Caddyfile) reach the test stack's web:8080, which is a
    # separate Compose project (different Docker network) only reachable via the host's own port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks: [spelc]

volumes:
  db_data:
  # Certificates and ACME account state — must persist across container recreates, or every
  # `docker compose up --build` would re-request a fresh certificate (Let's Encrypt rate-limits
  # that) and briefly serve plain HTTP in the meantime.
  caddy_data:
  caddy_config:

networks:
  spelc:
