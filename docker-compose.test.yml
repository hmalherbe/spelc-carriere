# Stack de TEST, isolée de la production — à utiliser depuis un second checkout du dépôt (ex.
# /opt/spelc-carriere-test), jamais depuis le checkout de production (/opt/spelc-carriere). Un
# second checkout donne à Docker Compose un nom de projet différent (dérivé du nom du dossier),
# donc des conteneurs/volume/réseau distincts automatiquement, sans rien partager avec la
# production — y compris sa base de données, qui doit être une COPIE (pg_dump/restore), jamais un
# lien vers la vraie. Voir le message de session qui accompagne ce fichier pour la procédure
# complète (dump, restauration, build, nettoyage).
#
# Seule différence avec docker-compose.yml : le port exposé par `web` (8080 au lieu de 80) — db et
# api n'exposent déjà aucun port côté hôte, rien d'autre à changer pour éviter toute collision.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spelc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spelc
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [spelc]

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://spelc:${POSTGRES_PASSWORD}@db:5432/spelc
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Spelc}
      ADEL_URL: ${ADEL_URL:-}
      ADEL_USERNAME: ${ADEL_USERNAME:-}
      ADEL_PASSWORD: ${ADEL_PASSWORD:-}
      ADEL_SPELC_NAME: ${ADEL_SPELC_NAME:-azur}
      ADEL_DEBUG_DIR: /app/adel-debug
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
    volumes:
      - ./adel-debug:/app/adel-debug
    depends_on:
      - db
    networks: [spelc]

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks: [spelc]

volumes:
  db_data:

networks:
  spelc:
