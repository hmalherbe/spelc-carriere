server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same rewrite as the Vite dev proxy (vite.config.ts): /api/xxx -> the API service, without
    # the /api prefix. The trailing slashes on both proxy_pass and location are what makes nginx
    # strip the prefix.
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Default is 60s ; la synchronisation ADEL (Playwright : login + navigation + export)
        # peut prendre plusieurs minutes, d'où le "504 Gateway Time-out" observé sinon.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA fallback: any other path serves index.html so React Router's client-side routes
    # (/import, /mailing, /regles...) work on a hard refresh or direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
